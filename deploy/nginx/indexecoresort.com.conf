# nginx site for https://indexecoresort.com — the Next.js app in services/frontend.
#
# nginx terminates TLS and serves the build's static files straight from disk;
# everything else goes to `next start` on 127.0.0.1:3000.
#
# Install (Ubuntu/Debian):
#   1. Build and run the app:
#        cd /var/www/indexecoresort/services/frontend
#        pnpm install --frozen-lockfile && pnpm build
#        pnpm start -- -H 127.0.0.1 -p 3000      # keep it alive with pm2 or systemd
#   2. Get a certificate (DNS for both names must already point here):
#        sudo mkdir -p /var/www/certbot
#        sudo certbot certonly --webroot -w /var/www/certbot \
#             -d indexecoresort.com -d www.indexecoresort.com
#      On a fresh server nginx cannot start with this file before the
#      certificate exists — use `certbot certonly --standalone` (nginx stopped)
#      the first time instead.
#   3. Enable it:
#        sudo cp indexecoresort.com.conf /etc/nginx/sites-available/
#        sudo ln -s /etc/nginx/sites-available/indexecoresort.com.conf /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
#
# If the app lives somewhere other than /var/www/indexecoresort, change the two
# paths under "Static files" below. The nginx user (www-data) needs read access
# to .next/static and public/media.

upstream indexecoresort_next {
    server 127.0.0.1:3000;
    keepalive 32;
}

# The contact form posts to /api/forms/contact; a few submissions a minute per
# visitor is plenty, and anything beyond that is a bot.
limit_req_zone $binary_remote_addr zone=indexecoresort_forms:10m rate=10r/m;

# ── http → https ─────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name indexecoresort.com www.indexecoresort.com;

    # certbot renewals (webroot mode)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://indexecoresort.com$request_uri;
    }
}

# ── www → apex (the canonical origin, NEXT_PUBLIC_SITE_URL) ──────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;   # nginx < 1.25.1: drop this line and use `listen 443 ssl http2;`
    server_name www.indexecoresort.com;

    ssl_certificate     /etc/letsencrypt/live/indexecoresort.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/indexecoresort.com/privkey.pem;

    return 301 https://indexecoresort.com$request_uri;
}

# ── The site ─────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;   # nginx < 1.25.1: drop this line and use `listen 443 ssl http2;`
    server_name indexecoresort.com;

    ssl_certificate     /etc/letsencrypt/live/indexecoresort.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/indexecoresort.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:indexecoresort_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/indexecoresort.access.log;
    error_log  /var/log/nginx/indexecoresort.error.log warn;

    server_tokens off;

    # Next.js sets CSP, nosniff, Referrer-Policy, X-Frame-Options and
    # Permissions-Policy itself (next.config.ts). HSTS is the one it leaves to us.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # No uploads anywhere; the largest body is the contact form's JSON.
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Inherited by every proxy_pass below. Host and X-Forwarded-Proto let the
    # language redirects in src/proxy.ts build https://indexecoresort.com URLs.
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # public/ carries stray .DS_Store files; never serve dotfiles.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # ── Static files ─────────────────────────────────────────────────────────
    # Content-hashed build output: safe to cache forever.
    location ^~ /_next/static/ {
        alias /var/www/indexecoresort/services/frontend/.next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    # The mirrored CMS media (~150 MB of images and mp4s). Names are unique per
    # upload but not content hashes, so cache for a month rather than forever.
    # nginx answers the Range requests the background videos need.
    location /media/ {
        root /var/www/indexecoresort/services/frontend/public;
        expires 30d;
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    # ── The app ──────────────────────────────────────────────────────────────
    location /api/forms/ {
        limit_req zone=indexecoresort_forms burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://indexecoresort_next;
    }

    # Responses are buffered (nginx's default) so a slow visitor never ties up
    # Node. Nothing streams today; a route that adds Suspense streaming should
    # send `X-Accel-Buffering: no`, which nginx honours per response.
    location / {
        proxy_pass http://indexecoresort_next;
    }
}
