# nginx site for https://index.reeddoy.com — a preview of services/frontend on
# the shared VPS (172.105.34.9), next to the insurancebd site.
#
# Cloudflare proxies this name in "Flexible" SSL mode: visitors get https from
# Cloudflare, which already redirects http → https at its edge and then talks
# to this origin over plain http on port 80. So this block must not redirect to
# https — that would loop.
#
# Installed as /etc/nginx/sites-available/reeddoy-index-eco-resort. The name
# sorts after `insurancebd`, so that site stays nginx's default server and
# nothing about it changes. The app itself is index-eco-resort.service
# (deploy/systemd/), listening on 127.0.0.1:3100 only.

upstream index_eco_resort {
    server 127.0.0.1:3100;
    keepalive 16;
}

# The contact form posts to /api/forms/contact; a few submissions a minute per
# visitor is plenty, and anything beyond that is a bot.
limit_req_zone $binary_remote_addr zone=index_eco_resort_forms:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name index.reeddoy.com;

    # Every request arrives from a Cloudflare edge; recover the visitor's IP so
    # logs and the rate limit see people, not Cloudflare.
    # https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    access_log /var/log/nginx/index-eco-resort.access.log;
    error_log  /var/log/nginx/index-eco-resort.error.log warn;

    # No uploads anywhere; the largest body is the contact form's JSON.
    client_max_body_size 1m;

    # Inherited by every proxy_pass below. Visitors only ever reach Cloudflare
    # over https, so tell Next.js that — the language redirects in
    # src/proxy.ts then point straight at https://index.reeddoy.com.
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;

    # public/ carries stray .DS_Store files; never serve dotfiles.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # Next.js serves public/ with max-age=0. The mirrored CMS media (~150 MB of
    # images and mp4s) has unique per-upload names, so let Cloudflare and
    # browsers keep it for a month instead of asking this 1-CPU box every time.
    location /media/ {
        proxy_pass http://index_eco_resort;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /api/forms/ {
        limit_req zone=index_eco_resort_forms burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://index_eco_resort;
    }

    location / {
        proxy_pass http://index_eco_resort;
    }
}
